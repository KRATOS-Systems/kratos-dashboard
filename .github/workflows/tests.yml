# Prüft jede Änderung, bevor sie in main (und damit live) darf: Build und alle Testskripte.
# Die Tests laufen nur gegen das Test-Odoo (scripts/mockOdoo.mjs) mit Wegwerf-Datenbanken, nie gegen echte Daten.
name: Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npx vite build
      - name: Abfrage-Takt
        run: node scripts/testPoll.mjs
      - name: Programmlaufzeit
        run: node scripts/testLaufzeit.mjs
      - name: Odoo-Abgleich (Lücken)
        run: node scripts/testLuecken.mjs
      - name: Datensicherung
        run: node scripts/testBackup.mjs
      - name: Maschine im Arbeitsplan
        run: node scripts/testArbeitsplan.mjs
      - name: Arbeitsplan und Laufzeit mit den neuen Sammelplatz-Namen (Maschine offen)
        run: node scripts/testArbeitsplan.mjs && node scripts/testLaufzeit.mjs
        env:
          MOCK_POOL_NEU: "1"
      - name: Rückmeldungen
        run: node scripts/testFeedback.mjs
      - name: Anmeldung
        run: node scripts/testLogin.mjs
      - name: Stücklisten-Kennzeichnung
        run: node scripts/testStueckliste.mjs
      - name: Vollständigkeit der Kundenaufträge (Entwürfe, Warnliste, Differenz)
        run: node scripts/testEntwuerfe.mjs
      - name: Frühwarnung bei Lieferverzug (Mail-Entwurf, Kunde informiert)
        run: node scripts/testFruehwarnung.mjs
      - name: Planvorschlag für nicht eingeplante Positionen
        run: node scripts/testPlanvorschlag.mjs
      - name: Aufgaben (Von mir vergeben)
        run: node scripts/testAufgaben.mjs
      - name: Verbindung zu QS (Prüfplan, EMPB)
        run: node scripts/testQsBridge.mjs
