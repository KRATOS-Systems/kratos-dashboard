<!doctype html>
<html lang="de" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <!-- Symbol im Tab: helle Bildmarke bei dunklem Browser, dunkle bei hellem -->
    <link rel="icon" type="image/svg+xml" href="/favicon-dark.svg" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon-light.svg" media="(prefers-color-scheme: light)" />
    <title>Kratos Produktion</title>
    <script>
      /* Look vor dem ersten Zeichnen setzen, damit nichts flackert (siehe src/look.css) */
      try {
        document.documentElement.dataset.look = localStorage.getItem("kratos-look") === "alt" ? "alt" : "neu";
      } catch (e) {
        document.documentElement.dataset.look = "neu";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
