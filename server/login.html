<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#090B0F">
<title>Anmelden · Kratos Produktion</title>
<link rel="icon" type="image/svg+xml" href="/favicon-dark.svg" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/svg+xml" href="/favicon-light.svg" media="(prefers-color-scheme: light)">
<style>
  :root { --acc: #FF5A64; --acc2: #E5323B; --ink: #F3F5F8; --muted: #A9B0BC; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #090B0F; color: var(--ink);
    font: 400 15px/1.45 "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    display: grid; place-items: center; min-height: 100dvh; overflow: hidden;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  .bg, .loop, .shade { position: fixed; inset: 0; width: 100%; height: 100%; }
  .bg { background: #090B0F url(/login-assets/halle.webp) center / cover no-repeat; transform: scale(1.04); filter: saturate(1.05); }
  .loop { object-fit: cover; opacity: 0; transition: opacity 1.4s ease; transform: scale(1.04); }
  .loop.on { opacity: 1; }
  .shade {
    background:
      radial-gradient(70% 60% at 50% 48%, rgba(9, 11, 15, .15), rgba(9, 11, 15, .78) 100%),
      radial-gradient(800px 460px at 6% -6%, rgba(229, 50, 59, .24), transparent 70%);
  }
  main { position: relative; width: min(100%, 400px); }
  form {
    padding: 34px 30px 28px; border-radius: 26px; text-align: center;
    background: linear-gradient(150deg, rgba(255, 255, 255, .11), rgba(255, 255, 255, .035) 60%, rgba(255, 255, 255, .025));
    border: 1px solid rgba(255, 255, 255, .13);
    box-shadow: 0 30px 80px rgba(0, 0, 0, .55), inset 0 1px 0 rgba(255, 255, 255, .09);
    backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
  }
  .mark { width: 54px; height: 54px; margin: 0 auto 14px; display: block; }
  h1 { margin: 0; line-height: 0; }
  .wm { width: 190px; max-width: 70%; height: auto; display: block; margin: 0 auto; }
  .sub { margin: 12px 0 24px; color: var(--muted); font-size: 12px; letter-spacing: .3em; text-transform: uppercase; }
  .field { position: relative; }
  input[type=password], input[type=text] {
    width: 100%; height: 50px; padding: 0 16px; border-radius: 14px; font: inherit; font-size: 16px; color: var(--ink);
    background: rgba(0, 0, 0, .32); border: 1px solid rgba(255, 255, 255, .16); outline: none; transition: border-color .15s, box-shadow .15s;
  }
  input::placeholder { color: #7D8594; }
  input:focus { border-color: var(--acc); box-shadow: 0 0 0 3px rgba(255, 90, 100, .22); }
  .user { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .msg { display: none; margin: 12px 2px 0; padding: 9px 12px; border-radius: 12px; font-size: 13px; text-align: left; color: #FFD5D8; background: rgba(229, 50, 59, .16); border: 1px solid rgba(255, 90, 100, .35); }
  .msg.show { display: block; }
  button {
    width: 100%; height: 50px; margin-top: 16px; border: 0; border-radius: 999px; cursor: pointer; font: inherit; font-size: 16px; font-weight: 600; color: #fff;
    background: linear-gradient(145deg, var(--acc), var(--acc2)); box-shadow: 0 10px 28px rgba(229, 50, 59, .45); transition: filter .15s, transform .1s;
  }
  button:hover { filter: brightness(1.08); }
  button:active { transform: translateY(1px); }
  button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .foot { margin-top: 18px; font-size: 12px; color: #858D9B; }
  @media (prefers-reduced-motion: reduce) { .loop { display: none; } }
  @media (max-width: 420px) { form { padding: 28px 20px 22px; } }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<video class="loop" id="loop" muted loop playsinline preload="none" aria-hidden="true" tabindex="-1"></video>
<div class="shade" aria-hidden="true"></div>
<main>
  <form method="post" action="/login" autocomplete="on">
    <svg class="mark" viewBox="0 0 1932 1932" role="img" aria-label="Kratos"><path d="M0 0H703L0 703Z" fill="#F6F6F6"/><path d="M1053 0H1580L0 1580V1053Z" fill="#F6F6F6"/><path d="M0 1932L965 965 1932 1932H1405L965 1492 526 1932Z" fill="#EE3340"/></svg>
    <h1><svg class="wm" viewBox="0 0 2000 403" role="img" aria-label="Kratos"><path d="M0 10H77V181L208 10H297L153 198 304 398H216L77 216V398H0Z" fill="#F6F6F6"/><path fill-rule="evenodd" d="M337 10H495C570 10 622 70 622 140C622 200 585 240 547 252L632 398H550L472 264H414V398H337ZM414 82V196H495C525 196 546 170 546 139C546 108 525 82 495 82Z" fill="#F6F6F6"/><path d="M789 10H884L1021 398H938L837 98 736 398H653Z" fill="#F6F6F6"/><path d="M782 398L837 233 893 398Z" fill="#EE3340"/><path d="M987 10H1273V84H1168V398H1092V84H987Z" fill="#F6F6F6"/><path d="M1444 6A203 203 0 0 0 1444 404V326A127 127 0 0 1 1444 84Z" fill="#F6F6F6"/><path d="M1521 6A203 203 0 0 1 1521 404V326A127 127 0 0 0 1521 84Z" fill="#F6F6F6"/><path d="M1962 100C1936 55 1902 37 1862 37C1805 37 1763 68 1763 114C1763 160 1800 177 1860 195C1920 213 1962 227 1962 290C1962 336 1925 365 1862 365C1805 365 1772 340 1750 292" fill="none" stroke="#F6F6F6" stroke-width="76"/></svg></h1>
    <p class="sub">Produktion</p>
    <input class="user" type="text" name="username" value="{{USER}}" autocomplete="username" tabindex="-1" aria-hidden="true">
    <input type="hidden" name="next" value="{{NEXT}}">
    <div class="field"><input type="password" name="password" placeholder="Passwort" autocomplete="current-password" autofocus required aria-label="Passwort"></div>
    <div class="msg{{MELDUNGSKLASSE}}" role="alert">{{MELDUNG}}</div>
    <button type="submit">Anmelden</button>
    <div class="foot">Kratos Precision GmbH</div>
  </form>
</main>
<script>
  // Das Video läuft nur am Rechner (Maus, breiter Bildschirm), nicht mit Datensparmodus und nicht bei reduzierter Bewegung; sonst bleibt das Standbild
  (function () {
    try {
      var c = navigator.connection || {};
      var ok = window.matchMedia("(hover: hover) and (min-width: 900px)").matches && !window.matchMedia("(prefers-reduced-motion: reduce)").matches && !c.saveData;
      if (!ok) return;
      var v = document.getElementById("loop");
      v.addEventListener("canplay", function () { v.classList.add("on"); }, { once: true });
      v.src = "/login-assets/halle.mp4";
      var p = v.play();
      if (p && p.catch) p.catch(function () {});
    } catch (e) {}
  })();
</script>
</body>
</html>
